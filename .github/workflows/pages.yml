name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'buddy-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push supersedes one in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Wrap the page into a full document
        run: python3 buddy-site/build.py

      # enablement turns Pages on the first time this runs, so there's no
      # manual step in repo settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: buddy-site/dist

      - id: deployment
        uses: actions/deploy-pages@v4
