<!doctype html>
<html lang="en">
<head>

  <title>Buddy</title>
  <link rel="stylesheet" href="app.css">
</head>

      <div class="side-mark">
        <svg viewBox="0 0 100 110" aria-hidden="true"><use id="sideChar" href="#c-nub"></use></svg>
        Buddy
      </div>

      <button class="nav-item on" data-view="today">Today</button>

      <button class="nav-item" data-view="team">Team</button>

      <div class="nav-spacer"></div>
      <div class="nav-sep"></div>
      <button class="nav-item" data-view="settings">Settings</button>

    <main class="main" id="main"></main>

  <script type="module" src="app.js"></script>
