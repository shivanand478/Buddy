<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Welcome to Conviea</title>
  <link rel="stylesheet" href="app.css">
  <style>
    body { background: var(--bg); }
    .wrap { height: 100vh; display: flex; flex-direction: column; }
    .step { flex: 1; overflow-y: auto; padding: 34px 34px 20px; display: flex; flex-direction: column; gap: 18px; }
    .step.center { align-items: center; justify-content: center; text-align: center; }
    .step h2 { font-size: 24px; }
    .step p.sub { margin: 0; color: var(--text-mid); font-family: var(--font-body); font-size: 15px; max-width: 42ch; }
    .hero-buddy img { width: 146px; height: 146px; object-fit: contain; }
    .hero-buddy.small img { width: 84px; height: 84px; object-fit: contain; }
    .ready-head { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }

    /* what should Conviea help with — multi-select */
    .focus-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px;
    }
    .focus-card {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 14px; text-align: left;
      background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
      cursor: pointer; font: inherit; color: inherit;
      transition: background .12s ease, border-color .12s ease;
    }
    .focus-card:hover { border-color: var(--accent); }
    .focus-card .e { font-size: 19px; line-height: 1; }
    .focus-card .t { font-weight: 600; font-size: 14px; }
    .focus-card.on { background: var(--accent-soft); border-color: var(--accent); }

    .always {
      font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .12em;
      text-transform: uppercase; color: var(--sage);
      border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px;
      white-space: nowrap;
    }

    .foot {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 22px; border-top: 1px solid var(--line);
    }
    .dots { display: flex; gap: 5px; flex: 1; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
    .dot.on { background: var(--accent); }

    /* the inline reminder mock */
    .demo-stage {
      width: 100%;
      background: var(--bg-alt);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      min-height: 118px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      overflow: hidden;
    }
    .demo-pop {
      display: flex; align-items: flex-end; gap: 8px;
      opacity: 0; transform: translateY(14px) scale(.95);
      transition: opacity .3s ease, transform .45s cubic-bezier(.18,1.4,.42,1);
    }
    .demo-pop.in { opacity: 1; transform: none; }
    .demo-pop img { width: 62px; height: 62px; object-fit: contain; flex: none; }
    .demo-bubble {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 12px; padding: 10px 12px;
      box-shadow: 0 14px 30px -14px rgba(0,0,0,.4);
    }
    .demo-kind { font-family: var(--font-mono); font-size: 9px; letter-spacing: .12em; color: var(--text-dim); }
    .demo-msg { font-weight: 700; font-size: 13.5px; margin-top: 4px; letter-spacing: -.02em; }
    .demo-acts { display: flex; gap: 5px; margin-top: 9px; }
    .demo-acts span {
      font-size: 10.5px; font-weight: 600; padding: 4px 9px;
      border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line);
    }
    .demo-acts span.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

    /* permission rows */
    .perm { width: 100%; display: flex; flex-direction: column; gap: 4px; }
    .perm-row {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 14px 0; border-bottom: 1px dashed var(--line-soft);
    }
    .perm-row:last-child { border-bottom: 0; }
    .perm-t { font-weight: 600; font-size: 14px; }
    .perm-d { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; max-width: 46ch; }
    .pe { margin-right: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="step" id="step"></div>
    <div class="foot" id="foot">
      <div class="dots" id="dots"></div>
      <button class="btn btn-quiet" id="back" hidden>Back</button>
      <button class="btn btn-primary" id="next">Continue</button>
    </div>
  </div>
  <script type="module" src="onboarding.js"></script>
</body>
</html>
